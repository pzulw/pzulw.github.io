<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wisner.org</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --panel: #ffffff;
      --ink: #1f1f1f;
      --muted: #5b5b5b;
      --line: #d9d2c8;
      --accent: #3a6ea5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 32px 20px;
    }

    .card {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      padding: 40px 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.2rem, 8vw, 4rem);
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 22px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>wisner.org</h1>
    <p>Welcome.</p>
    <a href="paul.html">Go to Paul</a>
  </main>
</body>
</html>
